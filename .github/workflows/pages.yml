name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Generate and validate site
        env:
          PORTFOLIO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 make-system-graphic.py
          python3 generate.py
          python3 scripts/build_pages.py --base-path "$PORTFOLIO_BASE_PATH"
          python3 scripts/check_pages.py --base-path "$PORTFOLIO_BASE_PATH"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
